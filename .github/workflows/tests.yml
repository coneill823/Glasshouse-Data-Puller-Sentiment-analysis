name: tests

# The suite needs no network and runs in about a second. Every test pins a bug
# that was once found on real data, so a red run means one has come back.
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow
      - run: python -m unittest discover -s tests -t . -v
