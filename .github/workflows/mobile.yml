name: mobile

# Checks the phone app, builds it for Android and for iPhone, and then runs
# the built app on an Android emulator and an iPhone simulator. The Android
# build is kept as a download: open a run on the Actions tab and take
# "glasshouse-android" from the bottom of the page.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the app was written and tested with. Raise it deliberately.
  FLUTTER_VERSION: "3.50.1"

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Includes the checks that the app's arithmetic matches the website's,
      # and that no screen overflows on a small phone with large text.
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # With no release key in the repository this is signed with the debug
      # key: it installs on any Android phone, but Google Play will not take it.
      # One file for every processor type, emulators included. It is larger
      # than a phone needs, but there is no wrong one to pick.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: glasshouse-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Installs the app on an emulated phone and uses it: reads the bundled data,
  # searches, answers the quiz, closes the app and checks the answers are
  # still there. This is the test that the installed app works on Android.
  android-device:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: mobile
          script: flutter test integration_test

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Proves the iPhone app compiles. Signing it for the App Store needs an
      # Apple developer account, which only the owner has: see mobile/README.md.
      - run: flutter build ios --release --no-codesign
      # The same on-device test as Android, on the newest iPhone simulator
      # this machine has.
      - name: Run the app on an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for name in sorted((r for r in runtimes if 'iOS' in r), reverse=True):
              phones = [d for d in runtimes[name] if d['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid'])
                  break
          ")
          xcrun simctl boot "$udid"
          flutter test integration_test -d "$udid"
